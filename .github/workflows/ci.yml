name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

# Canonical CI test environment (matches docs/networking.md):
#   Node A 192.168.8.244 | Node B 192.168.8.245 | VIP 192.168.8.243
env:
  CI_ENV: |
    NODE_IP=192.168.8.244
    NODE_ROLE=MASTER
    HOSTNAME=pi-dns-1
    DOMAIN_NAME=lan
    TZ=UTC
    WEBPASSWORD=ci_test_password
    FTLCONF_webserver_api_password=ci_test_password
    FTLCONF_dns_upstreams=127.0.0.1#5335
    FTLCONF_dns_dnssec=true
    FTLCONF_local_ipv4=192.168.8.244
    DNSMASQ_LISTENING=all
    REV_SERVER=true
    REV_SERVER_TARGET=192.168.8.1
    REV_SERVER_DOMAIN=lan
    REV_SERVER_CIDR=192.168.8.0/24
    VIP_ADDRESS=192.168.8.243
    VIP_NETMASK=32
    NETWORK_INTERFACE=eth0
    KEEPALIVED_PRIORITY=200
    VIRTUAL_ROUTER_ID=51
    ROUTER_ID=orion-dns-ha
    VRRP_PASSWORD=ci_test8c
    USE_UNICAST_VRRP=true
    PEER_IP=192.168.8.245
    UNICAST_SRC_IP=192.168.8.244
    LOKI_URL=http://192.168.8.245:3100/loki/api/v1/push

jobs:
  compose-validation:
    name: Validate compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Write CI env file
        run: printf '%s\n' "$CI_ENV" > .env
      - name: Validate canonical compose.yml (all profiles)
        run: |
          docker compose -f compose.yml config -q
          for p in single-node two-node-ha-primary two-node-ha-backup exporters netsec; do
            echo "--- profile: $p ---"
            docker compose --profile "$p" config --services
          done

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: pip install yamllint
      - name: Write yamllint config
        run: |
          cat > .yamllint.yml <<'EOF'
          extends: default
          rules:
            line-length: {max: 200, level: warning}
            document-start: disable
            comments: {min-spaces-from-content: 1, level: warning}
            indentation: {spaces: 2, indent-sequences: true}
            truthy: {allowed-values: ['true', 'false', 'on', 'off']}
            trailing-spaces: disable
            comments-indentation: disable
          ignore: |
            .github/
            node_modules/
            venv/
          EOF
      - name: Run yamllint (advisory)
        run: yamllint -c .yamllint.yml . || true

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck (advisory until scripts/ is deduped)
        run: |
          mapfile -t scripts < <(find . -path ./.git -prune -o -name '*.sh' -type f -print)
          echo "Linting ${#scripts[@]} shell scripts"
          shellcheck --severity=error "${scripts[@]}" || true

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run hadolint on all Dockerfiles (advisory)
        run: |
          for df in $(find . -path ./.git -prune -o -name 'Dockerfile*' -type f -print); do
            echo "=== $df ==="
            docker run --rm -i hadolint/hadolint < "$df" || true
          done

  arm64-build:
    name: ARM64 build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build keepalived image for linux/arm64
        run: |
          docker buildx build --platform linux/arm64 ./keepalived \
            --tag orion-keepalived:arm64-ci --load
      - name: Confirm canonical DNS image is multi-arch (arm64)
        run: |
          docker buildx imagetools inspect \
            ghcr.io/mpgirro/docker-pihole-unbound:2026.05.0 | grep -i 'linux/arm64' \
            && echo "✓ pihole-unbound publishes linux/arm64" \
            || (echo "✗ canonical DNS image missing arm64 manifest" && exit 1)

  trivy-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Trivy filesystem + secret + misconfig scan (advisory)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --no-progress --exit-code 0 /repo

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Fail on any committed secret (Trivy secret scanner)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners secret --no-progress --exit-code 1 /repo

  docs-check:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Required docs present
        run: |
          required="README.md docs/AUDIT.md docs/networking.md docs/architecture.md docs/troubleshooting.md docs/disaster-recovery.md"
          missing=0
          for f in $required; do
            if [ -f "$f" ]; then echo "✓ $f"; else echo "✗ missing $f"; missing=1; fi
          done
          exit $missing
      - name: No stale clone URL in docs
        run: |
          if grep -rIn "Orion-sentinel-ha-dns" --include='*.md' .; then
            echo "✗ stale clone URL found"; exit 1
          fi
          echo "✓ no stale clone URLs"

  integration-test:
    name: Integration test (DNS + blocking + DNSSEC)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
      - name: Write CI env + scaffold dirs
        run: |
          printf '%s\n' "$CI_ENV" > .env
          ./scripts/bootstrap_dirs.sh
      - name: Pull images (while host DNS still works)
        run: docker compose --profile single-node pull -q
      - name: Free port 53 (stop systemd-resolved stub)
        run: sudo systemctl stop systemd-resolved || true
      - name: Start the single-node stack
        run: docker compose --profile single-node up -d
      - name: Wait for Pi-hole to answer DNS (≤120s)
        run: |
          for i in $(seq 1 60); do
            if dig +tries=1 +time=2 @127.0.0.1 pi.hole >/dev/null 2>&1; then echo "DNS up after $((i*2))s"; ok=1; break; fi
            sleep 2
          done
          if [ "${ok:-0}" != 1 ]; then echo "::error::Pi-hole never came up"; docker compose --profile single-node logs; exit 1; fi
      - name: DNS recursion resolves (Unbound → root)
        run: |
          for i in 1 2 3; do
            a=$(dig +tries=1 +time=3 @127.0.0.1 github.com +short | grep -E '^[0-9]+\.' || true)
            [ -n "$a" ] && { echo "✓ github.com → $a"; exit 0; }
            sleep 3
          done
          echo "::error::recursion failed"; docker compose --profile single-node logs pihole_unbound; exit 1
      - name: DNSSEC validation rejects a bad signature
        run: |
          # dnssec-failed.org is deliberately broken — a validating resolver must SERVFAIL
          if dig +tries=1 +time=4 @127.0.0.1 dnssec-failed.org 2>&1 | grep -q "status: SERVFAIL"; then
            echo "✓ DNSSEC enforced (SERVFAIL on bad domain)"
          else
            echo "::warning::DNSSEC SERVFAIL not observed (upstream/egress dependent) — not failing the build"
          fi
      - name: Ad/tracker blocking works
        run: |
          docker exec pihole_unbound sqlite3 /etc/pihole/gravity.db \
            "INSERT OR IGNORE INTO domainlist (type,domain,enabled,comment) VALUES (1,'blocked.ci.test',1,'ci');
             INSERT OR IGNORE INTO domainlist_by_group (domainlist_id,group_id) VALUES ((SELECT id FROM domainlist WHERE type=1 AND domain='blocked.ci.test'),0);"
          docker exec pihole_unbound pihole reloaddns
          sleep 3
          ans=$(dig +tries=1 +time=3 @127.0.0.1 blocked.ci.test +short)
          if [ -z "$ans" ] || [ "$ans" = "0.0.0.0" ] || [ "$ans" = "::" ]; then
            echo "✓ blocked.ci.test is blocked (answer: '${ans:-<empty>}')"
          else
            echo "::error::blocklist not enforced (got '$ans')"; exit 1
          fi
      - name: Container reports healthy
        run: |
          for i in $(seq 1 12); do
            s=$(docker inspect --format '{{.State.Health.Status}}' pihole_unbound 2>/dev/null || echo none)
            [ "$s" = healthy ] && { echo "✓ healthy"; exit 0; }
            sleep 5
          done
          echo "::error::container not healthy (last: ${s:-?})"; docker compose --profile single-node logs pihole_unbound; exit 1
      - name: Teardown
        if: always()
        run: docker compose --profile single-node down -v || true
