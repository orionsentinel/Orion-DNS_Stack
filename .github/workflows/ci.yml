name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

# Canonical CI test environment (matches docs/networking.md):
#   Node A 192.168.8.244 | Node B 192.168.8.245 | VIP 192.168.8.243
env:
  CI_ENV: |
    NODE_IP=192.168.8.244
    NODE_ROLE=MASTER
    HOSTNAME=pi-dns-1
    DOMAIN_NAME=lan
    TZ=UTC
    WEBPASSWORD=ci_test_password
    FTLCONF_webserver_api_password=ci_test_password
    FTLCONF_dns_upstreams=127.0.0.1#5335
    FTLCONF_dns_dnssec=true
    FTLCONF_local_ipv4=192.168.8.244
    DNSMASQ_LISTENING=all
    REV_SERVER=true
    REV_SERVER_TARGET=192.168.8.1
    REV_SERVER_DOMAIN=lan
    REV_SERVER_CIDR=192.168.8.0/24
    VIP_ADDRESS=192.168.8.243
    VIP_NETMASK=32
    NETWORK_INTERFACE=eth0
    KEEPALIVED_PRIORITY=200
    VIRTUAL_ROUTER_ID=51
    ROUTER_ID=orion-dns-ha
    VRRP_PASSWORD=ci_test8c
    USE_UNICAST_VRRP=true
    PEER_IP=192.168.8.245
    UNICAST_SRC_IP=192.168.8.244
    LOKI_URL=http://192.168.8.245:3100/loki/api/v1/push

jobs:
  compose-validation:
    name: Validate compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Write CI env file
        run: printf '%s\n' "$CI_ENV" > .env
      - name: Validate canonical compose.yml (all profiles)
        run: |
          docker compose -f compose.yml config -q
          for p in single-node two-node-ha-primary two-node-ha-backup exporters netsec; do
            echo "--- profile: $p ---"
            docker compose --profile "$p" config --services
          done

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: pip install yamllint
      - name: Write yamllint config
        run: |
          cat > .yamllint.yml <<'EOF'
          extends: default
          rules:
            line-length: {max: 200, level: warning}
            document-start: disable
            comments: {min-spaces-from-content: 1, level: warning}
            indentation: {spaces: 2, indent-sequences: true}
            truthy: {allowed-values: ['true', 'false', 'on', 'off']}
            trailing-spaces: disable
            comments-indentation: disable
          ignore: |
            .github/
            node_modules/
            venv/
          EOF
      - name: Run yamllint (advisory)
        run: yamllint -c .yamllint.yml . || true

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck (advisory until scripts/ is deduped)
        run: |
          mapfile -t scripts < <(find . -path ./.git -prune -o -name '*.sh' -type f -print)
          echo "Linting ${#scripts[@]} shell scripts"
          shellcheck --severity=error "${scripts[@]}" || true

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run hadolint on all Dockerfiles (advisory)
        run: |
          for df in $(find . -path ./.git -prune -o -name 'Dockerfile*' -type f -print); do
            echo "=== $df ==="
            docker run --rm -i hadolint/hadolint < "$df" || true
          done

  arm64-build:
    name: ARM64 build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build keepalived image for linux/arm64
        run: |
          docker buildx build --platform linux/arm64 ./keepalived \
            --tag orion-keepalived:arm64-ci --load
      - name: Confirm canonical DNS image is multi-arch (arm64)
        run: |
          docker buildx imagetools inspect \
            ghcr.io/mpgirro/docker-pihole-unbound:2025.03.0 | grep -i 'linux/arm64' \
            && echo "✓ pihole-unbound publishes linux/arm64" \
            || (echo "✗ canonical DNS image missing arm64 manifest" && exit 1)

  trivy-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Trivy filesystem + secret + misconfig scan (advisory)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --no-progress --exit-code 0 /repo

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Fail on any committed secret (Trivy secret scanner)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners secret --no-progress --exit-code 1 /repo

  docs-check:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Required docs present
        run: |
          required="README.md docs/AUDIT.md docs/networking.md docs/architecture.md docs/troubleshooting.md docs/disaster-recovery.md"
          missing=0
          for f in $required; do
            if [ -f "$f" ]; then echo "✓ $f"; else echo "✗ missing $f"; missing=1; fi
          done
          exit $missing
      - name: No stale clone URL in docs
        run: |
          if grep -rIn "Orion-sentinel-ha-dns" --include='*.md' .; then
            echo "✗ stale clone URL found"; exit 1
          fi
          echo "✓ no stale clone URLs"
