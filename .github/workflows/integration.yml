name: Integration test

# Boots the real single-node stack and proves DNS works. Heavy (pulls the
# Pi-hole image + boots FTL), so it runs on push-to-main, nightly, and on demand
# — NOT a per-PR gate. All DNS queries run *inside* the container
# (docker exec … dig), so there's no host :53 / systemd-resolved interaction, and
# every wait is hard-bounded by `timeout` so the job can never hang.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: DNS + DNSSEC + blocking + health (single-node)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Write env + scaffold dirs
        run: |
          cat > .env <<'EOF'
          NODE_IP=192.168.8.244
          HOSTNAME=pi-dns-ci
          DOMAIN_NAME=lan
          TZ=UTC
          WEBPASSWORD=ci_test_password
          FTLCONF_webserver_api_password=ci_test_password
          FTLCONF_dns_upstreams=127.0.0.1#5335
          FTLCONF_dns_dnssec=true
          DNSMASQ_LISTENING=all
          EOF
          ./scripts/bootstrap_dirs.sh
      - name: Pull image (fail fast if it stalls)
        run: timeout 480 docker compose --profile single-node pull
      - name: Free port 53 (container uses host networking)
        run: |
          # pihole_unbound runs with network_mode: host, so dnsmasq binds the
          # runner's 0.0.0.0:53 — which collides with systemd-resolved on :53.
          # Stop it so FTL can bind. Then repoint the host resolver off the now-dead
          # 127.0.0.53 to a real one, so the container's startup gravity download
          # (StevenBlack blocklist) can still resolve before FTL takes over :53.
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo 'nameserver 1.1.1.1' | sudo tee /etc/resolv.conf >/dev/null
          sudo ss -lntup 'sport = :53' || true
      - name: Start the stack
        run: timeout 120 docker compose --profile single-node up -d
      - name: Wait for FTL to answer DNS (hard-bounded, in-container)
        run: |
          if ! timeout 150 bash -c '
            until [ "$(docker inspect -f "{{.State.Running}}" pihole_unbound 2>/dev/null)" = true ]; do sleep 2; done
            until docker exec pihole_unbound dig +tries=1 +time=2 @127.0.0.1 pi.hole >/dev/null 2>&1; do sleep 3; done
          '; then
            echo "::error::FTL never answered DNS within 150s"
            docker compose --profile single-node ps
            docker compose --profile single-node logs --tail 200
            exit 1
          fi
          echo "✓ FTL answering"
      - name: DNS recursion resolves (Unbound → root)
        run: |
          for _ in 1 2 3; do
            a=$(docker exec pihole_unbound dig +tries=1 +time=3 @127.0.0.1 github.com +short | grep -E '^[0-9]+\.' || true)
            [ -n "$a" ] && { echo "✓ github.com → $a"; exit 0; }
            sleep 3
          done
          echo "::error::recursion failed"; docker compose --profile single-node logs --tail 100 pihole_unbound; exit 1
      - name: DNSSEC rejects a bad signature
        run: |
          if docker exec pihole_unbound dig +tries=1 +time=4 @127.0.0.1 dnssec-failed.org 2>&1 | grep -q "status: SERVFAIL"; then
            echo "✓ DNSSEC enforced (SERVFAIL)"
          else
            echo "::warning::DNSSEC SERVFAIL not observed (egress-dependent)"
          fi
      - name: Ad/tracker blocking works
        run: |
          docker exec pihole_unbound sqlite3 /etc/pihole/gravity.db \
            "INSERT OR IGNORE INTO domainlist (type,domain,enabled,comment) VALUES (1,'blocked.ci.test',1,'ci');
             INSERT OR IGNORE INTO domainlist_by_group (domainlist_id,group_id) VALUES ((SELECT id FROM domainlist WHERE type=1 AND domain='blocked.ci.test'),0);"
          docker exec pihole_unbound pihole reloaddns
          sleep 3
          ans=$(docker exec pihole_unbound dig +tries=1 +time=3 @127.0.0.1 blocked.ci.test +short || true)
          if [ -z "$ans" ] || [ "$ans" = "0.0.0.0" ] || [ "$ans" = "::" ]; then
            echo "✓ blocked (answer: '${ans:-<empty>}')"
          else
            echo "::error::blocklist not enforced (got '$ans')"; exit 1
          fi
      - name: Container reports healthy
        run: |
          if timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" pihole_unbound 2>/dev/null)" = healthy ]; do sleep 5; done'; then
            echo "✓ healthy"
          else
            echo "::error::container not healthy"; docker compose --profile single-node logs --tail 100 pihole_unbound; exit 1
          fi
      - name: Teardown
        if: always()
        run: docker compose --profile single-node down -v || true
