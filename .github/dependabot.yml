# Dependabot — keep dependencies and the CI/CD supply chain current.
# Security updates are always on; these are the scheduled version updates.
version: 2
updates:
  # --- Container base images (canonical builds) ---
  - package-ecosystem: docker
    directory: /keepalived
    schedule: {interval: weekly}
    open-pull-requests-limit: 5


  # --- GitHub Actions (pin/upgrade CI actions) ---
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      ci-actions: {patterns: ["*"]}
    open-pull-requests-limit: 5
