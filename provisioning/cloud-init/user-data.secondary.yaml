#cloud-config
# =============================================================================
# Orion DNS — SECONDARY node (Node B) zero-touch first boot.
#
# Same idea as the primary template. The two secrets MUST be identical to the
# primary node:
#   VRRP_PASSWORD — EXACTLY 8 characters, identical to Node A.
#   WEBPASSWORD   — strong, identical to Node A.
# Note the mirrored addressing: this node is .245, its peer is .244.
# Canonical addressing: docs/networking.md.
# =============================================================================
package_update: true
packages: [git, ca-certificates]

write_files:
  - path: /etc/orion-dns/node.env       # per-node secrets, 0600, NOT in git
    permissions: '0600'
    content: |
      NODE_IP=192.168.8.245
      NODE_ROLE=BACKUP
      KEEPALIVED_PRIORITY=150
      VIP_ADDRESS=192.168.8.243
      NETWORK_INTERFACE=eth0
      PEER_IP=192.168.8.244
      UNICAST_SRC_IP=192.168.8.245
      WEBPASSWORD=CHANGE_ME_strong_password
      VRRP_PASSWORD=CHANGE_8c
      TZ=Europe/Athens

runcmd:
  - [git, clone, "https://github.com/orionsentinel/Orion-DNS_Stack.git", /opt/orion-dns-ha]
  - [bash, /opt/orion-dns-ha/provisioning/firstboot.sh, --env, /etc/orion-dns/node.env]
