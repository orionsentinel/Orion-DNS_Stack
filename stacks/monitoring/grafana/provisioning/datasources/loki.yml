# Grafana datasource — Loki (logs). DNS nodes ship logs here via their promtail
# (root compose `exporters` profile, LOKI_URL pointing at this host).
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 2000
