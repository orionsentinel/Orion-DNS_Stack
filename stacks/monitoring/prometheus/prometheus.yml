# Prometheus — Orion Sentinel DNS HA monitoring.
# Scrapes exporters the DNS nodes publish via the root compose `exporters`
# profile (node_exporter :9100, pihole_exporter :9617 on each node host), and
# probes DNS reachability of the VIP and each node via the blackbox exporter.
# Canonical addresses (docs/networking.md): Node A .244, Node B .245, VIP .243.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: orion-dns-ha

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Host metrics from each DNS node (root compose `exporters` profile)
  - job_name: node-exporter
    static_configs:
      - targets: ['192.168.8.244:9100']
        labels: {node: pi-dns-1, role: primary}
      - targets: ['192.168.8.245:9100']
        labels: {node: pi-dns-2, role: backup}

  # Pi-hole metrics from each node
  - job_name: pihole
    static_configs:
      - targets: ['192.168.8.244:9617']
        labels: {node: pi-dns-1, role: primary}
      - targets: ['192.168.8.245:9617']
        labels: {node: pi-dns-2, role: backup}

  # DNS reachability of the floating VIP — the user-facing SLO
  - job_name: dns_vip
    metrics_path: /probe
    params: {module: [dns_google]}
    static_configs:
      - targets: ['192.168.8.243']
        labels: {target: vip}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # DNS reachability of each node directly (detects a single-node failure)
  - job_name: dns_nodes
    metrics_path: /probe
    params: {module: [dns_google]}
    static_configs:
      - targets: ['192.168.8.244', '192.168.8.245']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
