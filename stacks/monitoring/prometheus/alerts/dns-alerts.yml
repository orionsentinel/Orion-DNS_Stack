# Degraded-state alerts for the Orion Sentinel DNS HA stack.
# Routed by Alertmanager to Signal. Addresses: nodes .244/.245, VIP .243.
groups:
  - name: dns_availability
    rules:
      - alert: VIPDnsDown
        expr: probe_success{job="dns_vip"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "DNS VIP is not resolving"
          description: "The floating VIP 192.168.8.243 failed DNS resolution for >1m. Clients have no DNS. Check keepalived/VIP and the active node."

      - alert: NodeDnsDown
        expr: probe_success{job="dns_nodes"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "DNS down on a node ({{ $labels.instance }})"
          description: "{{ $labels.instance }} stopped answering DNS for >2m. HA still served if the peer is up — investigate the failed node."

      - alert: AllDnsNodesDown
        expr: max(probe_success{job="dns_nodes"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "ALL DNS nodes are down"
          description: "Neither DNS node answered for >1m — full outage. Page now."

      - alert: DnsLatencyHigh
        expr: probe_dns_lookup_time_seconds{job=~"dns_.*"} > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "DNS latency high ({{ $labels.instance }})"
          description: "DNS lookups via {{ $labels.instance }} took >500ms for 5m."

  - name: targets_up
    rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "node_exporter unreachable ({{ $labels.node }})"
          description: "Prometheus cannot scrape node_exporter on {{ $labels.node }} ({{ $labels.instance }}) for >2m. Is the `exporters` profile up on that node?"

      - alert: PiholeExporterDown
        expr: up{job="pihole"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "pihole_exporter unreachable ({{ $labels.node }})"
          description: "Prometheus cannot scrape pihole_exporter on {{ $labels.node }} for >2m."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager target is down — alerts may not be delivered."

  - name: node_health
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "High CPU on {{ $labels.node }}"
          description: "CPU >85% for 10m on {{ $labels.node }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "High memory on {{ $labels.node }}"
          description: "Memory >90% for 10m on {{ $labels.node }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Low disk on {{ $labels.node }}"
          description: "Root filesystem <15% free on {{ $labels.node }}."
