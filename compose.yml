# Orion Sentinel Compose Configuration
# Do not use deprecated 'version:' key - modern compose spec doesn't require it
services:
  pihole_unbound:
    image: ghcr.io/mpgirro/docker-pihole-unbound:2026.05.0
    container_name: pihole_unbound
    mem_limit: 1g          # cap so a leak can't take the whole Pi; generous for FTL + gravity rebuilds
    profiles:
      - single-node
      - two-node-ha-primary
      - two-node-ha-backup
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      TZ: ${TZ:-UTC}
      HOSTNAME: ${HOSTNAME:-orion-dns}
      DOMAIN_NAME: ${DOMAIN_NAME:-lan}
      WEBPASSWORD: ${WEBPASSWORD:-changeme}
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password:-}
      FTLCONF_dns_upstreams: ${FTLCONF_dns_upstreams:-127.0.0.1#5335}
      FTLCONF_dns_dnssec: ${FTLCONF_dns_dnssec:-true}
      FTLCONF_local_ipv4: ${NODE_IP:-192.168.8.244}
      DNSMASQ_LISTENING: ${DNSMASQ_LISTENING:-all}
      REV_SERVER: ${REV_SERVER:-true}
      REV_SERVER_TARGET: ${REV_SERVER_TARGET:-192.168.8.1}
      REV_SERVER_DOMAIN: ${REV_SERVER_DOMAIN:-lan}
      REV_SERVER_CIDR: ${REV_SERVER_CIDR:-192.168.8.0/24}
      # Optional: DNS over TLS upstreams for Unbound (disabled by default for local recursion)
      # If you want DoT forwarding, use NextDNS - see unbound/nextdns-forward.conf
      UNBOUND_FORWARD_TLS: ${UNBOUND_FORWARD_TLS:-}
      UNBOUND_FORWARD_ZONES: ${UNBOUND_FORWARD_ZONES:-}
      # Optional: Redis caching support if enabled in the upstream image
      REDIS_ENABLE: ${REDIS_ENABLE:-false}
      REDIS_SERVER: ${REDIS_SERVER:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      - ./pihole/var-log:/var/log/pihole
      # Optional: NextDNS DoT forwarding config
      # If the file exists, Unbound forwards to NextDNS over DoT.
      # If absent/unmounted, Unbound performs full local recursive resolution.
      - ./unbound/nextdns-forward.conf:/etc/unbound/unbound.conf.d/nextdns-forward.conf:ro
    # Self-healing (layer 2): liveness probe. If the DNS server stops answering on
    # 127.0.0.1:53 the container is marked unhealthy and `autoheal` restarts it.
    # (Full-chain recursion failure is handled by keepalived's check_dns.sh → VIP
    # failover. dig exits 0 even on NXDOMAIN, so this only fails if FTL is wedged.)
    healthcheck:
      test: ["CMD-SHELL", "dig +tries=1 +time=3 @127.0.0.1 pi.hole >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      autoheal: "true"

  keepalived:
    build:
      context: ./keepalived
    container_name: keepalived
    mem_limit: 64m
    profiles:
      - two-node-ha-primary
      - two-node-ha-backup
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_ROLE: ${NODE_ROLE:-MASTER}
      KEEPALIVED_PRIORITY: ${KEEPALIVED_PRIORITY:-200}
      ROUTER_ID: ${ROUTER_ID:-orion-dns-ha}
      VIP_ADDRESS: ${VIP_ADDRESS:-192.168.8.243}
      VIP_NETMASK: ${VIP_NETMASK:-32}
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-eth0}
      VIRTUAL_ROUTER_ID: ${VIRTUAL_ROUTER_ID:-51}
      VRRP_PASSWORD: ${VRRP_PASSWORD:-oriondns}
      USE_UNICAST_VRRP: ${USE_UNICAST_VRRP:-true}
      PEER_IP: ${PEER_IP:-}
      UNICAST_SRC_IP: ${UNICAST_SRC_IP:-}
      CHECK_DNS_TARGET: ${CHECK_DNS_TARGET:-127.0.0.1}
      # Anti-flap: probe the LOCAL resolver liveness (pi.hole is always answerable),
      # not an external name — so an ISP/internet blip can't demote MASTER and drop
      # the VIP. Set to a recursive name only if you specifically want full-chain checks.
      CHECK_DNS_FQDN: ${CHECK_DNS_FQDN:-pi.hole}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-5}
      CHECK_TIMEOUT: ${CHECK_TIMEOUT:-3}
      CHECK_WEIGHT: ${CHECK_WEIGHT:--20}
      CHECK_FALL: ${CHECK_FALL:-2}
      CHECK_RISE: ${CHECK_RISE:-2}
    volumes:
      - ./keepalived/config:/etc/keepalived
    # Liveness only — NOT autoheal-labelled. keepalived self-heals the HA layer by
    # releasing the VIP on DNS failure; restarting its container would flap the VIP.
    healthcheck:
      test: ["CMD-SHELL", "pidof keepalived >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Self-healing (layer 2): watchdog that restarts containers labelled
  # autoheal=true when their Docker healthcheck reports unhealthy. Pairs with
  # `restart: unless-stopped` (crash recovery) and keepalived (HA/VIP failover).
  # See docs/architecture.md → "Self-healing".
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    mem_limit: 64m
    profiles:
      - single-node
      - two-node-ha-primary
      - two-node-ha-backup
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-10}
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD:-120}
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
